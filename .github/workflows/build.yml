# Build on native Linux x86_64 for optimal performance (HPI/OpenVINO).
# HPI install succeeds only on linux/amd64; fails on arm64/emulated.
name: Build OCR API (Linux x86_64)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Native linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: paddleocr-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run -d -p 8000:8000 --name ocr-test paddleocr-api:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 5
          done
          docker stop ocr-test 2>/dev/null || true
